<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#071916" />
  <title>沽渌农业自动化管理总控台</title>
  <style>
    :root { --ink:#eaf8f2; --muted:#9cb6ad; --line:rgba(173,241,211,.15); --panel:rgba(6,27,26,.68); --accent:#54f0b2; --blue:#5bcdf8; --orange:#ffbe72; }
    * { box-sizing:border-box; }
    html { background:#061411; }
    body { margin:0; min-width:320px; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:#061411; overflow-x:hidden; }
    body::before { content:""; position:fixed; z-index:-3; inset:0; background:linear-gradient(90deg,rgba(3,15,18,.82),rgba(3,15,17,.46) 52%,rgba(3,14,14,.66)),url("assets/smart-farm-bg-v2.jpg") center/cover no-repeat; }
    body::after { content:""; position:fixed; z-index:-2; inset:0; opacity:.62; background-image:linear-gradient(rgba(117,255,201,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(117,255,201,.04) 1px,transparent 1px); background-size:44px 44px; mask-image:linear-gradient(to bottom,black,transparent 86%); }
    .shell { min-height:100vh; max-width:1540px; margin:auto; padding:28px 42px 42px; position:relative; }
    .shell::before { content:""; position:absolute; inset:0 0 auto; height:2px; background:linear-gradient(90deg,transparent 3%,var(--accent) 22%,rgba(91,205,248,.12) 52%,transparent 92%); box-shadow:0 0 22px rgba(84,240,178,.9); }
    .topbar { display:flex; gap:22px; justify-content:space-between; align-items:center; padding-bottom:28px; border-bottom:1px solid var(--line); }
    .brand { display:flex; align-items:center; gap:14px; }
    .brand-mark { width:44px; height:44px; border:1px solid rgba(110,255,196,.66); border-radius:13px 13px 13px 3px; display:grid; place-items:center; color:var(--accent); background:linear-gradient(135deg,rgba(84,240,178,.23),rgba(91,205,248,.04)); box-shadow:inset 0 0 20px rgba(84,240,178,.12),0 0 18px rgba(84,240,178,.14); font-size:25px; }
    .eyebrow,.section-kicker { margin:0 0 5px; color:#7ee0ba; font-size:11px; letter-spacing:.17em; text-transform:uppercase; }
    h1 { margin:0; font-weight:650; font-size:20px; letter-spacing:.035em; }
    .clock { text-align:right; color:var(--muted); font-size:13px; line-height:1.7; font-variant-numeric:tabular-nums; }
    .clock strong { display:block; color:#d7f5e8; letter-spacing:.08em; font-size:15px; font-weight:550; }
    main { padding-top:42px; }
    .hero { display:flex; justify-content:space-between; gap:30px; align-items:end; margin-bottom:29px; }
    .hero h2 { max-width:720px; margin:0; font-size:clamp(27px,4vw,48px); line-height:1.13; letter-spacing:-.035em; font-weight:650; }
    .hero h2 em { color:#76efc1; font-style:normal; text-shadow:0 0 22px rgba(84,240,178,.32); }
    .hero p { max-width:420px; margin:0 0 3px; color:var(--muted); font-size:14px; line-height:1.8; }
    .metrics { display:grid; grid-template-columns:repeat(3,minmax(120px,1fr)); gap:12px; margin-bottom:34px; }
    .metric { min-height:92px; padding:15px 17px; border:1px solid var(--line); border-radius:14px; background:linear-gradient(135deg,rgba(15,55,47,.71),rgba(6,28,29,.62)); backdrop-filter:blur(13px); box-shadow:inset 0 1px rgba(255,255,255,.035); }
    .metric label { display:block; color:var(--muted); font-size:12px; margin-bottom:11px; }
    .metric strong { font-size:25px; letter-spacing:-.03em; font-weight:600; }
    .metric strong span { font-size:12px; font-weight:400; color:#9fc8bb; margin-left:4px; }
    .cards { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:20px; }
    .bot-card { position:relative; min-height:350px; overflow:hidden; padding:26px; border:1px solid rgba(164,245,209,.2); border-radius:22px; background:linear-gradient(135deg,rgba(11,50,43,.84),rgba(6,24,27,.71)); box-shadow:0 20px 55px rgba(0,0,0,.2),inset 0 1px rgba(255,255,255,.05); backdrop-filter:blur(16px); cursor:pointer; transition:transform .25s ease,border-color .25s ease,box-shadow .25s ease; }
    .bot-card:hover,.bot-card:focus-visible { transform:translateY(-5px); border-color:rgba(100,247,188,.6); box-shadow:0 25px 65px rgba(0,0,0,.28),0 0 32px rgba(51,214,157,.12),inset 0 1px rgba(255,255,255,.08); outline:none; }
    .bot-card::before { content:""; position:absolute; width:260px; height:260px; right:-110px; top:-120px; border:1px solid rgba(104,244,190,.22); border-radius:50%; box-shadow:0 0 0 28px rgba(104,244,190,.025),0 0 0 57px rgba(104,244,190,.018); }
    .bot-card::after { content:""; position:absolute; left:0; right:0; top:-40%; height:40%; background:linear-gradient(transparent,rgba(98,244,187,.14),transparent); animation:scan 6s linear infinite; pointer-events:none; }
    .card-top { display:flex; gap:15px; align-items:center; position:relative; z-index:1; }
    .avatar { width:64px; height:64px; object-fit:cover; border-radius:19px; border:1px solid rgba(150,249,205,.48); box-shadow:0 0 0 4px rgba(84,240,178,.07),0 8px 22px rgba(0,0,0,.25); }
    .name { min-width:0; flex:1; }
    .name h3 { margin:0 0 4px; font-size:20px; font-weight:610; }
    .name p { margin:0; color:#8fb7aa; font-size:12px; font-family:ui-monospace,SFMono-Regular,Menlo,monospace; }
    .status { display:flex; align-items:center; gap:7px; white-space:nowrap; color:#a7eecf; font-size:12px; }
    .lamp { width:8px; height:8px; border-radius:50%; background:var(--accent); box-shadow:0 0 0 0 rgba(84,240,178,.7); animation:pulse 1.8s infinite; }
    .task { position:relative; z-index:1; margin-top:31px; }
    .task label,.progress-row { color:#8daea3; font-size:12px; }
    .task h4 { margin:9px 0 17px; font-size:16px; line-height:1.55; font-weight:500; }
    .progress-row { display:flex; justify-content:space-between; margin-bottom:8px; }
    .bar { height:7px; overflow:hidden; border-radius:99px; background:rgba(160,230,205,.12); border:1px solid rgba(160,230,205,.08); }
    .bar i { display:block; height:100%; border-radius:inherit; background:linear-gradient(90deg,#35c891,#86f7bd 50%,#65cfe9); box-shadow:0 0 15px rgba(84,240,178,.68); }
    .kpis { position:relative; z-index:1; display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-top:22px; }
    .kpi { padding:11px 12px; border-radius:11px; background:rgba(3,20,19,.34); border:1px solid rgba(174,239,211,.09); }
    .kpi span { display:block; color:#8caea1; font-size:11px; margin-bottom:5px; }.kpi strong { font-size:15px; font-weight:550; }
    .dialog-cta { position:relative; z-index:1; display:flex; justify-content:space-between; align-items:center; margin-top:24px; padding-top:18px; border-top:1px solid rgba(178,240,216,.12); color:#b9e9d6; font-size:13px; }.dialog-cta b { display:grid; place-items:center; width:31px; height:31px; border-radius:50%; color:#06221a; background:var(--accent); font-size:18px; }
    .drawer { position:fixed; z-index:5; top:0; right:0; width:min(500px,100%); height:100dvh; display:flex; flex-direction:column; transform:translateX(104%); transition:transform .32s cubic-bezier(.2,.75,.2,1); border-left:1px solid rgba(141,244,199,.28); background:linear-gradient(150deg,rgba(7,33,31,.98),rgba(4,17,21,.98)); box-shadow:-22px 0 80px rgba(0,0,0,.45); }.drawer.open { transform:translateX(0); }
    .drawer-head { display:flex; align-items:center; gap:13px; padding:24px; border-bottom:1px solid var(--line); }.drawer-head .avatar { width:48px; height:48px; border-radius:15px; }.drawer-title { flex:1; }.drawer-title strong { display:block; font-size:16px; }.drawer-title span { color:var(--muted); font-size:12px; }.close { width:34px; height:34px; border:1px solid var(--line); border-radius:10px; background:rgba(255,255,255,.04); color:var(--ink); cursor:pointer; font-size:20px; }
    .chat-meta { padding:11px 24px; color:#8bb6a7; font-size:11px; letter-spacing:.06em; border-bottom:1px solid rgba(171,239,212,.08); }.chat-meta::before { content:""; display:inline-block; width:6px; height:6px; margin-right:7px; border-radius:50%; background:var(--accent); }
    .messages { flex:1; overflow:auto; padding:22px 20px 16px; display:flex; flex-direction:column; gap:13px; }.message { max-width:82%; padding:11px 13px; border-radius:5px 15px 15px; font-size:14px; line-height:1.65; white-space:pre-wrap; word-break:break-word; }.message.bot { align-self:flex-start; background:rgba(110,222,176,.12); border:1px solid rgba(131,241,194,.15); color:#e6f8f0; }.message.user { align-self:flex-end; border-radius:15px 5px 15px 15px; background:linear-gradient(135deg,#167d68,#16637b); color:white; }.thinking { align-self:flex-start; display:flex; align-items:center; gap:8px; color:#aad2c2; font-size:13px; }.dots i { display:inline-block; width:5px; height:5px; margin:0 2px; border-radius:50%; background:#77f1be; animation:dot 1.2s infinite; }.dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}.slow-note { color:#f6c98b; font-size:12px; }
    .composer { padding:16px 20px calc(18px + env(safe-area-inset-bottom)); border-top:1px solid var(--line); display:flex; gap:10px; background:rgba(2,15,18,.55); }.composer textarea { flex:1; height:45px; min-height:45px; max-height:100px; resize:none; padding:12px; border:1px solid rgba(162,235,208,.18); border-radius:12px; color:#e9fff5; background:rgba(255,255,255,.045); outline:none; font:14px/1.4 inherit; }.composer textarea:focus { border-color:rgba(84,240,178,.62); }.send { width:47px; border:0; border-radius:12px; background:linear-gradient(135deg,#60efb5,#5bbfe8); color:#062119; cursor:pointer; font-size:20px; font-weight:700; }.send:disabled { opacity:.45; cursor:not-allowed; }
    .backdrop { position:fixed; z-index:4; inset:0; background:rgba(0,8,10,.55); opacity:0; visibility:hidden; transition:.25s; }.backdrop.show { opacity:1; visibility:visible; }
    @keyframes pulse { 70% { box-shadow:0 0 0 7px rgba(84,240,178,0); } 100% { box-shadow:0 0 0 0 rgba(84,240,178,0); } } @keyframes scan { to { transform:translateY(350%); } } @keyframes dot { 0%,80%,100%{transform:translateY(0);opacity:.3}40%{transform:translateY(-4px);opacity:1} }
    @media (max-width:760px) { .shell{padding:21px 17px 28px}.topbar{align-items:flex-start}.clock{font-size:11px}.clock strong{font-size:12px}.hero{display:block;margin-top:4px}.hero p{margin-top:15px}.metrics{grid-template-columns:repeat(3,1fr);gap:8px}.metric{padding:12px 10px;min-height:76px}.metric strong{font-size:20px}.metric label{font-size:10px;margin-bottom:8px}.cards{grid-template-columns:1fr;gap:14px}.bot-card{min-height:0;padding:21px}.drawer{width:100%} }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { animation:none!important; transition:none!important; scroll-behavior:auto!important; } }
  </style>
</head>
<body>
  <div class="shell">
    <header class="topbar">
      <div class="brand"><div class="brand-mark">⌁</div><div><p class="eyebrow" id="eyebrowText">GULU AGRI · AUTOMATION COMMAND</p><h1 id="companyTitle">沽渌农业自动化管理总控台</h1></div></div>
      <div class="clock"><strong id="clock">--:--:--</strong><span id="date">正在同步本地时间</span></div>
    </header>
    <main>
      <section class="hero"><div><p class="section-kicker">Agricultural Intelligence Command Center</p><h2>让每一寸农田，<em>被看见、被理解、被调度。</em></h2></div><p>连接本机 Hermes 农业协作网络<br>SALES × PRODUCTION · 实时任务总控</p></section>
      <section class="metrics" aria-label="总体数据"><div class="metric"><label>协同任务 / TOTAL TASKS</label><strong>24<span>项</span></strong></div><div class="metric"><label>今日完成率 / COMPLETION</label><strong>78<span>%</span></strong></div><div class="metric"><label>部门 Bot / NETWORK</label><strong id="networkStatus">02<span>在线</span></strong></div></section>
      <section class="cards" id="botCards" aria-label="部门 Bot 控制卡"></section>
    </main>
  </div>
  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-label="Bot 对话窗口" aria-hidden="true">
    <div class="drawer-head"><img class="avatar" id="drawerAvatar" alt="" /><div class="drawer-title"><strong id="drawerName">—</strong><span id="drawerId">—</span></div><button class="close" id="closeDrawer" aria-label="关闭对话">×</button></div>
    <div class="chat-meta" id="chatMeta">HERMES BOT · 连接就绪</div>
    <div class="messages" id="messages" aria-live="polite"></div>
    <form class="composer" id="chatForm"><textarea id="messageInput" placeholder="输入任务指令或问题…" aria-label="消息内容"></textarea><button class="send" id="sendBtn" type="submit" aria-label="发送消息">↑</button></form>
  </aside>
  <script>
    (() => {
      const FALLBACK_BOTS = [
        { id:'agri-xiaoshou', dept:'农业销售部', state:'在线', task:'梳理本周高意向客户，生成首轮回访建议', progress:72, kpi1:'今日跟进客户', value1:'12 位', kpi2:'订单转化', value2:'3 单', image:'assets/agri-sales-bot.png', welcome:'您好，我是农业销售部智能助手。我可以协助市场开拓、客户跟进与订单转化。' },
        { id:'agri-shengchan', dept:'农业生产部', state:'工作中', task:'监测秋季叶菜批次长势，更新明日农事排产', progress:58, kpi1:'今日排产', value1:'8 亩', kpi2:'农事执行', value2:'6 项', image:'assets/agri-production-bot.png', welcome:'您好，我是农业生产部智能助手。我可以协助种植排产、农事执行和产量跟踪。' }
      ];
      const FALLBACK_COMPANY = { company:'沽渌农业自动化管理总控台', company_en:'GULU AGRI · AUTOMATION COMMAND' };
      let bots = FALLBACK_BOTS;
      const $ = id => document.getElementById(id);
      const cards = $('botCards'), drawer = $('drawer'), backdrop = $('backdrop'), messages = $('messages'), input = $('messageInput'), sendBtn = $('sendBtn');
      let activeBot = null, pending = false;
      let history = {};
      function escapeHTML(value) { const node = document.createElement('div'); node.textContent = value == null ? '' : String(value); return node.innerHTML; }
      function avatarFor(bot) {
        if (bot.image) return `<img class="avatar" src="${bot.image}" alt="${bot.dept} Bot 形象"/>`;
        const ch = (bot.dept || bot.id || 'B').trim().charAt(0);
        return `<div class="avatar" style="display:grid;place-items:center;font-size:26px;font-weight:700;color:#06221a;background:linear-gradient(135deg,#54f0b2,#5bcdf8)">${escapeHTML(ch)}</div>`;
      }
      function renderCards() { cards.innerHTML = bots.map(bot => `<article class="bot-card" tabindex="0" data-bot="${bot.id}" role="button" aria-label="与${bot.dept}对话"><div class="card-top">${avatarFor(bot)}<div class="name"><h3>${escapeHTML(bot.dept)}</h3><p>${escapeHTML(bot.id)}</p></div><div class="status"><i class="lamp"></i>${escapeHTML(bot.state)}</div></div><div class="task"><label>CURRENT OPERATION / 当前任务</label><h4>${escapeHTML(bot.task)}</h4><div class="progress-row"><span>任务进度</span><span>${bot.progress}%</span></div><div class="bar"><i style="width:${bot.progress}%"></i></div></div><div class="kpis"><div class="kpi"><span>${escapeHTML(bot.kpi1)}</span><strong>${escapeHTML(bot.value1)}</strong></div><div class="kpi"><span>${escapeHTML(bot.kpi2)}</span><strong>${escapeHTML(bot.value2)}</strong></div></div><div class="dialog-cta"><span>开始对话，获取实时协作支持</span><b>→</b></div></article>`).join(''); }
      function addBubble(role, text, className='') { const el = document.createElement('div'); el.className = `message ${role} ${className}`; el.innerHTML = escapeHTML(text); messages.appendChild(el); messages.scrollTop = messages.scrollHeight; return el; }
      function renderHistory() { messages.innerHTML=''; (history[activeBot.id] || []).forEach(item => addBubble(item.role, item.text)); }
      function openBot(id) { activeBot = bots.find(bot => bot.id === id); if (!activeBot) return; $('drawerAvatar').src = activeBot.image || ''; $('drawerAvatar').style.display = activeBot.image ? '' : 'none'; if (!activeBot.image) { const ch=(activeBot.dept||'B').charAt(0); if(!document.getElementById('drawerAvatarFallback')){const d=document.createElement('div');d.id='drawerAvatarFallback';d.className='avatar';d.style.cssText='display:grid;place-items:center;font-size:24px;font-weight:700;color:#06221a;background:linear-gradient(135deg,#54f0b2,#5bcdf8)';$('drawerAvatar').parentElement.insertBefore(d,$('drawerAvatar').nextSibling);} document.getElementById('drawerAvatarFallback').textContent=ch; } else { const fb=document.getElementById('drawerAvatarFallback'); if(fb) fb.remove(); } $('drawerAvatar').alt = activeBot.dept; $('drawerName').textContent = activeBot.dept + ' · 智能协作 Bot'; $('drawerId').textContent = activeBot.id + ' / ' + activeBot.state; $('chatMeta').textContent = 'HERMES BOT · ' + activeBot.state + ' · 同步对话通道'; renderHistory(); drawer.classList.add('open'); backdrop.classList.add('show'); drawer.setAttribute('aria-hidden','false'); setTimeout(() => input.focus(), 180); }
      function closeBot() { drawer.classList.remove('open'); backdrop.classList.remove('show'); drawer.setAttribute('aria-hidden','true'); }
      function setPending(value) { pending=value; sendBtn.disabled=value; input.disabled=value; }
      async function submitMessage(event) { event.preventDefault(); const text = input.value.trim(); if (!text || !activeBot || pending) return; input.value=''; history[activeBot.id].push({role:'user',text}); addBubble('user',text); setPending(true); const thinking = document.createElement('div'); thinking.className='thinking'; thinking.innerHTML='正在思考 <span class="dots"><i></i><i></i><i></i></span>'; messages.appendChild(thinking); messages.scrollTop=messages.scrollHeight;
        const controller = new AbortController(); const timeout = setTimeout(() => controller.abort(), 60000); const slowTimer = setTimeout(() => { if (thinking.isConnected) { const note=document.createElement('span'); note.className='slow-note'; note.textContent='仍在处理，通常需要几十秒…'; thinking.appendChild(note); } }, 12000);
        try { const response = await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({bot:activeBot.id,message:text}),signal:controller.signal}); if(!response.ok) throw new Error(`服务返回 ${response.status}`); const data=await response.json(); if(typeof data.reply !== 'string') throw new Error('响应中未包含 reply'); history[activeBot.id].push({role:'bot',text:data.reply}); thinking.remove(); addBubble('bot',data.reply); } catch(error) { thinking.remove(); const message = error.name === 'AbortError' ? '请求等待超过 60 秒，暂未收到回复。请确认本机 Bot 服务状态后重试。' : `暂时无法连接本机 Bot：${error.message}`; history[activeBot.id].push({role:'bot',text:message}); addBubble('bot',message); } finally { clearTimeout(timeout); clearTimeout(slowTimer); setPending(false); input.focus(); }
      }
      function updateClock() { const now=new Date(); $('clock').textContent=now.toLocaleTimeString('zh-CN',{hour12:false}); $('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'short'}); }
      async function checkBots() { try { const response=await fetch('/api/bots'); if(!response.ok) return; const data=await response.json(); const list=Array.isArray(data)?data:(Array.isArray(data.bots)?data.bots:[]); $('networkStatus').innerHTML=String(list.length).padStart(2,'0')+'<span>在线</span>'; } catch (_) { /* 静态演示状态保留，聊天仍可直接请求 */ } }
      async function init() {
        try {
          const response = await fetch('/api/bots');
          if (response.ok) {
            const data = await response.json();
            const company = (data && data.company) || FALLBACK_COMPANY.company;
            const companyEn = (data && data.company_en) || FALLBACK_COMPANY.company_en;
            document.title = company;
            const ct = $('companyTitle'); if (ct) ct.textContent = company;
            const eb = $('eyebrowText'); if (eb) eb.textContent = companyEn;
            const heroH = data && data.hero_title;
            const h2 = document.querySelector('.hero h2'); if (h2 && heroH) h2.textContent = String(heroH);
            const arr = (data && Array.isArray(data.bots)) ? data.bots : FALLBACK_BOTS;
            if (arr && arr.length) {
              bots = arr.map(b => Object.assign({}, b));
              history = Object.fromEntries(bots.map(bot => [bot.id, [{role:'bot', text: bot.welcome || ''}]]));
              renderCards();
              return;
            }
          }
        } catch (_) { /* fallthrough */ }
        bots = FALLBACK_BOTS;
        history = Object.fromEntries(bots.map(bot => [bot.id, [{role:'bot', text: bot.welcome || ''}]]));
        renderCards();
      }
      updateClock(); setInterval(updateClock,1000); checkBots(); init();
      cards.addEventListener('click',event => { const card=event.target.closest('.bot-card'); if(card) openBot(card.dataset.bot); }); cards.addEventListener('keydown',event => { if((event.key==='Enter'||event.key===' ') && event.target.classList.contains('bot-card')) { event.preventDefault(); openBot(event.target.dataset.bot); } }); $('closeDrawer').addEventListener('click',closeBot); backdrop.addEventListener('click',closeBot); document.addEventListener('keydown',event=>{if(event.key==='Escape') closeBot();}); $('chatForm').addEventListener('submit',submitMessage); input.addEventListener('keydown',event=>{if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();$('chatForm').requestSubmit();}});
    })();
  </script>
</body>
</html>
